services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mensajes_backend_dev
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - nuget_cache:/root/.nuget/packages
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=mensajes;Username=postgres;Password=postgres
      - AdminAccess__ApiKey=${ADMIN_API_KEY:-1234}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: mensajes_postgres_dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mensajes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mensajes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  nuget_cache: